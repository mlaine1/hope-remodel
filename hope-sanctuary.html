<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hope Lutheran Sanctuary — Redesign Studio</title>
<style>
:root{
  --bg:#14110d; --panel:#1d1914; --panel2:#262019; --line:#3a3127; --ink:#ece4d2; --dim:#a99d86;
  --gilt:#cfa94e; --gilt2:#e7c979; --red:#8e2a2a; --ok:#7fae7a; --warn:#e0a24a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--gilt)}
button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
button.on{background:var(--gilt);color:#1a1408;border-color:var(--gilt);font-weight:600}
select,input[type=number],input[type=text]{background:#120f0b;border:1px solid var(--line);border-radius:5px;padding:4px 6px;max-width:100%}
select{width:100%}
input[type=number]{width:74px;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

#panel{position:fixed;left:0;top:0;bottom:54px;width:372px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5;transition:transform .2s}
#panel.closed{transform:translateX(-372px)}
#ptoggle{position:fixed;left:372px;top:10px;z-index:6;border-radius:0 6px 6px 0;border-left:none;padding:8px 7px;transition:left .2s;background:var(--panel)}
#panel.closed + #ptoggle{left:0}
#phead{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#phead h1{font-size:18px;color:var(--gilt2);letter-spacing:.2px}
#phead p{margin:2px 0 0;color:var(--dim);font-size:11.5px}
#schemebar{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--panel2)}
#schemebar .sbn{flex:1 1 100%;font-size:12.5px}
#schemebar .sbn b{font-family:var(--serif);font-size:14px;color:var(--gilt2)}
#schemebar .ed{color:var(--warn)} #schemebar .ok{color:var(--ok)}
#schemebar button{padding:3px 9px;font-size:12px}
#tabs{display:flex;gap:4px;padding:8px 10px 0}
#tabs button{flex:1;border-radius:6px 6px 0 0;border-bottom:none;padding:6px 4px;font-size:12px}
.tab{display:none;overflow:auto;flex:1;padding:8px 10px 20px;border-top:1px solid var(--line)}
.tab.on{display:block}
details.cat{border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:var(--panel2)}
details.cat>summary{cursor:pointer;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-family:var(--serif);font-size:14.5px;list-style:none}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary:before{content:"▸";color:var(--gilt);margin-right:6px}
details.cat[open]>summary:before{content:"▾"}
details.cat>summary span.t{flex:1}
details.cat>summary span.st{font:12px var(--sans);color:var(--gilt2)}
.grp{padding:6px 10px 8px;border-top:1px solid var(--line)}
.grp label.gl{display:block;color:var(--dim);font-size:11.5px;margin-bottom:3px}
.grp label.ck{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.grp .cl{font-size:11.5px;color:var(--gilt2);margin-top:3px}
.grp .cl div{display:flex;justify-content:space-between;gap:8px}
.grp .cl .q{color:var(--dim)}
.grp .flag{color:var(--warn);font-size:11.5px;margin-top:3px}
.grp.changed{box-shadow:inset 3px 0 0 var(--gilt)}
.note{color:var(--dim);font-size:11.5px;margin:6px 2px}
.warnbox{background:#3a2a12;border:1px solid #6b4d1c;color:#f0cf95;border-radius:6px;padding:6px 8px;font-size:11.5px;margin:6px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--panel)}
td.r,th.r{text-align:right}
tr.cat td{font-family:var(--serif);color:var(--gilt2);padding-top:8px;font-size:13.5px}
tr.tot td{font-weight:600;border-top:1px solid var(--gilt)}
.dimrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 2px;border-bottom:1px dashed var(--line)}
.dimrow span{flex:1}
.dimrow small{color:var(--dim)}

#top{position:fixed;right:10px;top:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 420px)}
#top .seg{display:flex;background:rgba(20,17,13,.82);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;backdrop-filter:blur(4px)}
#top .seg button{border:none;background:transparent;padding:5px 9px}
#top .seg button:hover{background:var(--panel2)}
#top .seg button.on{background:var(--gilt)}
#ba.on{background:var(--red);color:#fff;border-color:#c55}
#hint{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);background:rgba(20,17,13,.8);border:1px solid var(--line);padding:5px 12px;border-radius:20px;color:var(--dim);font-size:12px;z-index:4;pointer-events:none;white-space:nowrap}
#badge{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:var(--red);color:#fff;padding:4px 14px;border-radius:20px;font-family:var(--serif);z-index:4;display:none}

#bar{position:fixed;left:0;right:0;bottom:0;height:54px;background:var(--panel);border-top:1px solid var(--line);z-index:7;display:flex;align-items:center;gap:16px;padding:0 14px;overflow:hidden}
#bar .big{font-family:var(--serif);font-size:20px;color:var(--gilt2)}
#bar .kv{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
#bar .kv small{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
#bar input[type=number]{width:52px;padding:2px 4px}
#bar .sp{flex:1}
@media (max-width:1380px){#bar .note{display:none}}
.phase{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:8px 0;background:var(--panel2)}
.phase.cur{border-color:var(--gilt)}
.ph-h{display:flex;justify-content:space-between;gap:14px;font-family:var(--serif);font-size:15px;color:var(--gilt2);flex-wrap:wrap}
.phsteps{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:6px 0}
.phase select{width:auto;max-width:210px}
.phsteps button[draggable]{cursor:grab}
.phsteps button.dropL{box-shadow:-4px 0 0 var(--gilt2)}
.phsteps button.dropR{box-shadow:4px 0 0 var(--gilt2)}
.phsteps button.dragging{opacity:.4}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-weight:600;color:#14110d}
#drawer{position:fixed;left:0;right:0;bottom:54px;max-height:52vh;background:var(--panel);border-top:1px solid var(--gilt);z-index:6;overflow:auto;padding:8px 14px 14px;display:none}
#drawer.on{display:block}
#drawer th{background:var(--panel)}
.disc{color:var(--dim);font-size:11.5px;border-left:3px solid var(--warn);padding:4px 8px;margin:8px 0;background:#201a12}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--gilt);border-radius:10px;padding:16px 18px;max-width:860px;width:92vw;max-height:86vh;overflow:auto}
.sch{border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:6px;background:var(--panel2)}
.sch b{font-family:var(--serif);font-size:14px}
.sch .row{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center}
#err{position:fixed;inset:auto 0 60px 380px;color:#ffb4a8;background:#3a1612;padding:8px 12px;z-index:30;display:none;white-space:pre-wrap;font:12px monospace}
#printArea{display:none}
canvas#c{touch-action:none}
#stick{position:fixed;left:18px;bottom:72px;width:112px;height:112px;border-radius:50%;background:rgba(20,17,13,.45);border:1px solid rgba(231,201,121,.5);z-index:4;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(231,201,121,.75);pointer-events:none}
#stick.on{display:block}
.phsteps button[data-phid]{touch-action:none}
/* ---- narrow windows: toolbar and bottom bar scroll sideways instead of clipping ---- */
@media (max-width:1000px){
  #top{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #top::-webkit-scrollbar,#bar::-webkit-scrollbar{display:none}
  #top>*{flex:none} #top button{white-space:nowrap}
  #bar{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:12px}
  #bar>*{flex:none} #bar .sp{display:none}
  #bar button{order:1} #bar .kv{order:2} #bar .kv:first-child{order:0}
}
/* ---- phones: the options panel becomes a bottom sheet under the 3D view ---- */
@media (max-width:760px){
  body{font-size:14px}
  button{padding:8px 12px}
  select,input[type=number],input[type=text]{font-size:16px;padding:7px 8px}   /* 16px stops iOS zooming on focus */
  #panel{left:0;right:0;top:auto;bottom:54px;width:auto;height:52vh;border-right:none;border-top:1px solid var(--gilt)}
  #panel.closed{transform:translateY(calc(100% + 60px))}
  #phead{display:none}
  #ptoggle,#panel.closed + #ptoggle{left:8px;top:8px;border-radius:8px;border:1px solid var(--line);padding:8px 11px;background:rgba(20,17,13,.9)}
  #panel:not(.closed) + #ptoggle{background:var(--gilt);color:#1a1408;border-color:var(--gilt)}
  #top{left:56px;right:0;top:8px;max-width:none;padding-right:8px}
  #top .seg button{padding:7px 10px}
  #schemebar button{padding:6px 10px;font-size:13px}
  #tabs button{font-size:13px;padding:8px 2px}
  #hint{top:54px;bottom:auto;white-space:normal;width:max-content;max-width:92vw;text-align:center;font-size:11.5px;transition:opacity .6s}
  #hint.gone{opacity:0}
  #badge{top:auto;bottom:66px;white-space:nowrap}
  #bar{padding:0 10px} #bar .big{font-size:17px} #bar input[type=number]{width:60px;font-size:16px;padding:1px 4px}
  #drawer{max-height:62vh;padding:8px 10px 14px}
  #drawer table,#modal table{min-width:520px}
  #modal .box{padding:12px;width:96vw}
  .phase select{max-width:100%}
  .phsteps>.note{display:none} #drawer h3{font-size:15px} #drawer .ph-h{font-size:14px} #drawer .ph-h *{white-space:normal}
  .dimrow input{width:84px}
  #err{inset:auto 0 60px 0}
}
@media (max-height:480px){ #phead p{display:none} #phead{padding:6px 14px} #phead h1{font-size:15px} #hint{display:none} }   /* phone held sideways */
@media print{
  html,body{overflow:visible;background:#fff;color:#000;height:auto}
  canvas#c,#panel,#ptoggle,#top,#bar,#drawer,#hint,#badge,#modal,#err,#stick{display:none!important}
  #printArea{display:block;padding:10px 6px;font:11px/1.4 Georgia,serif;color:#000}
  #printArea h1{font-size:20px} #printArea h2{font-size:14px;margin-top:14px;border-bottom:1px solid #999}
  #printArea th,#printArea td{border-bottom:1px solid #ccc;padding:2px 5px;color:#000;background:none;position:static}
  #printArea tr.cat td{color:#000;font-weight:bold} #printArea img{max-width:100%;border:1px solid #999;margin:8px 0}
  #printArea .disc{border:1px solid #999;padding:6px;background:none;color:#000}
  #printArea .phase{border:1px solid #999;background:none;page-break-inside:avoid} #printArea .ph-h{color:#000} #printArea .note{color:#333}
}
</style>

</script>

<body>
<canvas id="c" tabindex="0"></canvas>

<aside id="panel">
  <div id="phead">
    <h1>Hope Lutheran · Sanctuary Studio</h1>
    <p>Walk the room, try redesign options, watch the rough cost. Sunbury, Ohio.</p>
  </div>
  <div id="schemebar"></div>
  <div id="tabs">
    <button data-tab="opts" class="on">Options</button>
    <button data-tab="schemes">Schemes</button>
    <button data-tab="dims">Dimensions</button>
    <button data-tab="prices">Prices</button>
  </div>
  <div class="tab on" id="tab-opts"></div>
  <div class="tab" id="tab-schemes"></div>
  <div class="tab" id="tab-dims"></div>
  <div class="tab" id="tab-prices"></div>
</aside>
<button id="ptoggle" title="Show / hide the options panel">☰</button>

<div id="top">
  <div class="seg" id="modes">
    <button data-mode="walk" class="on" title="First-person walk (WASD + mouse)">Walk</button>
    <button data-mode="orbit" title="Orbit / dollhouse view">Dollhouse</button>
    <button data-mode="outside" title="Step outside">Outside</button>
  </div>
  <div class="seg" id="presets">
    <button data-p="rear">Rear entrance</button>
    <button data-p="font">Aisle at font</button>
    <button data-p="pew">Pew seat</button>
    <button data-p="chancel">Chancel</button>
    <button data-p="pulpit">Pulpit</button>
  </div>
  <button id="ba" title="Toggle the current as-is sanctuary (key: B)">Show as-is (before)</button>
</div>
<div id="badge">BEFORE — existing sanctuary</div>
<div id="hint"></div>
<div id="stick" title="Walk"><i></i></div>

<div id="drawer"></div>
<div id="bar">
  <div class="kv"><small id="b-total-l">Estimated total (low – high)</small><span class="big num" id="b-total">$0</span></div>
  <div class="kv"><small>Per seat</small><span class="num" id="b-seat">–</span></div>
  <div class="kv"><small>Seats</small><span class="num" id="b-seats">–</span></div>
  <div class="kv"><small>Acoustics (est.)</small><span id="b-ac">–</span></div>
  <div class="kv"><small>Contingency %</small><input type="number" id="i-cont" min="0" max="50" step="1"></div>
  <div class="kv"><small>Design / permits %</small><input type="number" id="i-design" min="0" max="30" step="1"></div>
  <div class="sp"></div>
  <span class="note" style="max-width:230px;line-height:1.2">Rough 2026 Central Ohio ballparks — not quotes.</span>
  <button id="b-phases" title="Split the current design into build phases">Make phases</button>
  <button id="b-items">Itemized ▴</button>
  <button id="b-print">Print summary</button>
</div>

<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="err"></div>
<div id="printArea"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.addEventListener('error', e => { const el=document.getElementById('err'); el.style.display='block'; el.textContent += (e.message||e)+'\n'; });

/* ======================================================================
   1. DIMENSIONS — all in feet. Estimates from photos; edit in the
      "Dimensions" tab (or here) with tape-measured values.
   ====================================================================== */
const DIM_META = [
  // key, label, default, min, max, step
  ['W','Room width (wall to wall)',48,24,90,0.5],
  ['D','Room depth (chancel wall to the rear beam line)',56,30,140,0.5],
  ['wallH','Side-wall height',10,7,20,0.25],
  ['ridgeH','Ceiling height at ridge',19.5,9,40,0.25],
  ['platW','Chancel platform width (it stops short of the two front doors)',21,10,80,0.5],
  ['platD','Chancel platform depth',12,5,30,0.5],
  ['platH','Chancel platform height (6" per step)',1,0.5,3,0.5],
  ['glassW','Stained-glass group width (4 panels + posts)',19.5,8,40,0.5],
  ['glassSill','Stained-glass sill height above floor',11.5,6,25,0.25],
  ['aisleW','Center aisle width',8,3,16,0.5],
  ['rows','Seating rows per side',9,1,40,1],
  ['perRow','Chairs per row (each side)',8,1,20,1],
  ['rowSpacing','Row spacing, back to back',3.2,2.5,5,0.1],
  ['chairW','Seat width (chair or pew space)',1.67,1.4,2.2,0.01],
  ['frontClear','Clear floor: chancel step to first row',7,3,25,0.5],
  ['rearClear','Clear floor: last row to rear wall',8,3,40,0.5],
  ['sideWinCount','Right-wall window pairs',3,0,6,1],
  ['sideWinW','Width of each window pair',5.5,3,16,0.5],
  ['sideWinH','Height of each window pair',5.5,3,10,0.25],
  ['entryW','Entry alcove width (under the rear beam)',36,10,60,0.5],
  ['entryD','Entry alcove depth',8,4,20,0.5],
  ['bay','Bay spacing (trusses, pilasters, pendants)',11.5,6,20,0.5],
  ['expBay','Expansion: added bay length (post spacing)',8,6,16,0.5],
  ['expChancelD','Expansion: chancel addition depth',16,10,30,1],
  ['expAisleW','Expansion: side-aisle addition width',10,6,14,0.5],
];
const DIM = {}; DIM_META.forEach(m => DIM[m[0]] = m[2]);

/* ======================================================================
   2. COST DATA  —  *** EDIT PRICES HERE ***  (or in the "Prices" tab)
      Rough installed 2026 Central Ohio ballparks, NOT quotes.
      Each entry: label, unit, lo, hi (installed $ per unit).
      Assumptions changed from the starting anchors are marked (adj).
   ====================================================================== */
const COST = {
  // --- Flooring (per sq ft installed)
  demoCarpet:  {label:'Carpet removal & disposal', unit:'sf', lo:0.75, hi:1.5},
  subPrep:     {label:'Subfloor prep / leveling for hard flooring', unit:'sf', lo:1.5, hi:4},
  carpet:      {label:'New commercial carpet', unit:'sf', lo:4, hi:9},
  lvp:         {label:'Luxury vinyl plank', unit:'sf', lo:5, hi:10},
  oak:         {label:'Oak hardwood, finished', unit:'sf', lo:10, hi:20},
  porcelain:   {label:'Porcelain tile, stone look', unit:'sf', lo:12, hi:25},
  stone:       {label:'Natural slate / limestone', unit:'sf', lo:25, hi:50},
  checker:     {label:'Marble / porcelain checkerboard', unit:'sf', lo:18, hi:40},   // (adj) between porcelain and stone
  terrazzo:    {label:'Terrazzo', unit:'sf', lo:30, hi:60},
  runner:      {label:'Tile aisle runner with border', unit:'sf', lo:16, hi:32},      // (adj) porcelain + border labor
  // --- Chancel & altar
  platform:    {label:'Raise / extend chancel platform (framing, steps)', unit:'sf', lo:45, hi:110},
  railOak:     {label:'Oak communion rail', unit:'lf', lo:300, hi:700},
  railIron:    {label:'Wrought-iron communion rail, oak cap', unit:'lf', lo:400, hi:900},
  railCushion: {label:'Kneeling cushion at rail', unit:'lf', lo:40, hi:90},
  altarMove:   {label:'Move altar to east wall + footpace (predella)', unit:'ls', lo:1500, hi:5000},
  dossal:      {label:'Dossal curtain with rod & riddel posts', unit:'ea', lo:3000, hi:9000},
  tester:      {label:'Tester / baldachin canopy', unit:'ea', lo:6000, hi:20000},
  reredos:     {label:'Carved wood reredos', unit:'ea', lo:18000, hi:60000},
  altarOak:    {label:'New paneled oak altar', unit:'ea', lo:6000, hi:20000},
  altarStone:  {label:'Stone (limestone) altar', unit:'ea', lo:15000, hi:45000},
  crucifix:    {label:'Carved crucifix (corpus on cross)', unit:'ea', lo:2500, hi:12000},
  candles6:    {label:'Six altar candlesticks + gradine', unit:'set', lo:1800, hi:7000},
  frontal:     {label:'Full altar frontal (per color)', unit:'ea', lo:1500, hi:5000},
  pulpit:      {label:'Elevated pulpit with sounding board', unit:'ea', lo:12000, hi:40000},
  lectern:     {label:'Oak lectern', unit:'ea', lo:2000, hi:7000},
  credence:    {label:'Credence table', unit:'ea', lo:800, hi:3000},
  sedilia:     {label:'Sedilia (clergy bench, 3 seats)', unit:'ea', lo:3000, hi:10000},
  flagsMove:   {label:'Relocate / remove flags', unit:'ls', lo:0, hi:300},
  // --- Walls
  paint:       {label:'Repaint walls (prep + 2 coats)', unit:'sf', lo:1.75, hi:3.5},
  paintDeep:   {label:'Deep-color paint (primer + 2–3 coats)', unit:'sf', lo:2.25, hi:4.5},
  diaper:      {label:'Gilt diaper-pattern stencil on wall', unit:'sf', lo:8, hi:20},
  giltBand:    {label:'Gilt accent band', unit:'lf', lo:12, hi:35},
  stencil:     {label:'Stenciled border', unit:'lf', lo:18, hi:45},
  wains4:      {label:'Oak wainscot paneling to 4 ft', unit:'lf', lo:40, hi:90},
  wains7:      {label:'Oak paneling to 7 ft', unit:'lf', lo:90, hi:190},               // (adj) taller = ~2x
  stoneVeneer: {label:'Stone veneer', unit:'sf', lo:25, hi:55},
  limePanel:   {label:'Limestone-look wall panels', unit:'sf', lo:18, hi:40},
  station:     {label:'Station of the Cross plaque', unit:'ea', lo:250, hi:1200},
  icon:        {label:'Framed icon', unit:'ea', lo:600, hi:3000},
  mural:       {label:'Painted mural (chancel wall)', unit:'sf', lo:60, hi:180},
  hymnBoard:   {label:'New oak hymn board', unit:'ea', lo:700, hi:2200},
  consCross:   {label:'Consecration cross (gilt, wall-mounted)', unit:'ea', lo:90, hi:300},
  // --- Ceiling

const SRC = {
  glass:'Lutheran sources to ask: Kelly Schumacher (Agnus Dei Liturgical Arts).', sideGlass:'Lutheran sources to ask: Kelly Schumacher (Agnus Dei Liturgical Arts).', roseWin:'Lutheran sources to ask: Kelly Schumacher (Agnus Dei Liturgical Arts).',
  chancelArt:'Lutheran sources to ask: Edward Riojas (painted altarpieces, murals); Kelly Schumacher; Ad Crucem.', altarBack:'Sources to ask: Edward Riojas (painted reredos / altarpiece panels); Ecclesiastical Sewing (dossals).',
  textiles:'Sources to ask: Ecclesiastical Sewing; Ad Crucem.', frontal:'Sources to ask: Ecclesiastical Sewing; Ad Crucem.', stations:'Sources to ask: Edward Riojas; Ad Crucem.', cross:'Sources to ask: Ad Crucem; Kelly Schumacher (carved or painted corpus).',
};
const GROUPS = {}; CATS.forEach(c => c.groups.forEach(g => { if(!g.ref) { GROUPS[g.id] = g; g.cat = c; } }));
const LAYOUT_KEYS = ['aisleW','rows','perRow','rowSpacing'];
function asisState(){ const s = {}; for(const id in GROUPS){ const g = GROUPS[id]; s[id] = g.num ? null : g.opts[0][0]; } return s; }
const ASIS = Object.freeze(asisState());
let S = asisState();
const lay = (s,k) => s[k] ?? DIM[k];

/* ======================================================================
   4. GEOMETRY & QUANTITIES (pure function of DIM + a selection state)
   ====================================================================== */
function geo(s){
  const d = DIM, W = d.W, ext = s.expNave==='none' ? 0 : +s.expNave*d.expBay, D = d.D+ext, wallH = d.wallH, ridgeH = Math.max(d.ridgeH, wallH+1), rise = ridgeH-wallH;
  const g = {W, D, wallH, ridgeH, rise, warn:[]};
  g.ceilY = x => wallH + (1-Math.min(1, Math.abs(x)/(W/2)))*rise;
  g.ea = Math.max(3, Math.min(d.entryW/2, W/2-4)); g.eD = d.entryD; g.eH = Math.min(8.3, wallH-1.3);   // existing entry alcove behind the rear beam: half-width, depth, ceiling
  g.slopeL = Math.hypot(W/2, rise);
  // platform
  const raised = s.platform==='raised';
  const apse = s.expChancel==='yes'; g.ext = ext; g.apse = apse; g.cA = apse ? d.expChancelD : 0; g.cz = -g.cA; g.cw = Math.min(W-8, d.platW+13);   // chancel addition lies at z < 0
  g.aw = s.expAisle==='right' ? d.expAisleW : 0; g.xR = W/2+g.aw; g.hR = g.aw ? Math.min(9.2, wallH-0.6) : wallH;
  g.pw = apse ? g.cw-0.2 : Math.min(W-6, d.platW + (raised?6:0)); g.pd = apse ? g.cA : Math.min(D*0.4, d.platD + (raised?4:0));
  g.nSteps = raised ? Math.max(3, Math.round(d.platH/0.5)+1) : Math.max(1, Math.round(d.platH/0.5));
  g.ph = g.nSteps*0.5; g.stepsD = g.nSteps-1;
  g.floorAtL = (x,z) => { for(let i=0;i<g.nSteps;i++) if(Math.abs(x)<=g.pw/2+i && z<=g.pd+i) return g.ph-0.5*i; return 0; };   // z measured from the east wall
  g.floorAt = (x,z) => g.floorAtL(x, z-g.cz);
  g.zStepL = g.pd + g.stepsD; g.zStep = g.cz + g.zStepL;      // front edge of lowest step
  // glass group
  const gw = Math.min(d.glassW, W-8, apse ? g.cw-5 : 1e9), pt = 0.6, pc = 0.4; g.gw = gw; g.pt = pt;
  g.sill = Math.min(d.glassSill, g.ceilY(gw/2)-1.5);
  const top = x => Math.max(g.sill+1, g.ceilY(x)-0.55); g.glassTop = top;
  g.panels = [[-gw/2+pt, -gw/4-pt/2],[-gw/4+pt/2, -pc/2],[pc/2, gw/4-pt/2],[gw/4+pt/2, gw/2-pt]].map(([x0,x1]) => ({x0,x1,t0:top(x0),t1:top(x1)}));
  g.glassSF = g.panels.reduce((a,p) => a + (p.x1-p.x0)*((p.t0+p.t1)/2-g.sill), 0);
  g.doorX = Math.min(W/2-3, gw/2 + 3.3);    // sacristy door centers (±)
  g.outerPostX = Math.min(W/2-1, Math.max(g.doorX+2.3, d.platW/2-0.3));
  if(apse){ g.doorX = Math.min(g.doorX, g.cw/2-2.6); g.outerPostX = Math.min(g.outerPostX, g.cw/2-0.6); }
  // side-wall openings (z measured from the chancel wall)
  g.openL = [{k:'door', z:D*0.14, w:3, h:6.8, y:0}, {k:'win', z:D*0.7, w:6.5, h:4.3, y:2.9}, {k:'door2', z:D-5, w:6, h:6.8, y:0}];
  g.openR = [{k:'exit', z:D*0.17, w:3, h:6.8, y:0}];
  const n = d.sideWinCount, z0 = D*0.4, z1 = D-9, wy = 1.5, wh = Math.min(d.sideWinH, wallH-1.6-wy);
  for(let i=0;i<n;i++) g.openR.push({k:'glass', z: n===1 ? z0 : z0 + (z1-z0)*i/(n-1), w:d.sideWinW, h:wh, y:wy});
  g.nOpen = g.openL.length + g.openR.length;
  g.sideGlassSF = n*d.sideWinW*wh*0.7;
  // bays
  g.bays = Math.max(2, Math.round(D/d.bay)); g.bayL = D/g.bays;
  g.trussZ = []; for(let i=1;i<g.bays;i++) g.trussZ.push(i*g.bayL);
  g.nTruss = g.trussZ.length; g.nPil = 2*g.nTruss;
  g.truss = kind => {
    const A=[-W/2,wallH-0.45], R=[0,ridgeH-0.45], m=[]; const mir = (p,q) => { m.push([p,q]); m.push([[-p[0],p[1]],[-q[0],q[1]]]); };
    mir(A,R);
    if(kind==='scissor'){ const t=0.55, P=[W/2*(1-t), A[1]+(R[1]-A[1])*t]; mir(A,P); const yc = A[1]+(P[1]-A[1])*(W/2)/(W/2+P[0]); m.push([[0,yc],R]); }
    else { const hb=W*0.16, yc=wallH+rise*0.62-0.45, xc=W/2*(1-0.62), H=[-W/2+hb,wallH-0.45];
      mir(A,H); mir(H,[H[0], g.ceilY(H[0])-0.45]); mir([-W/2,wallH-3.4],H); mir(H,[-xc*0.35,yc]); m.push([[-xc,yc],[xc,yc]]); m.push([[0,yc],R]); }
    return m; };
  g.trussLF = kind => g.truss(kind).reduce((a,[p,q]) => a+Math.hypot(q[0]-p[0],q[1]-p[1]),0)*g.nTruss;
  g.pendPos = []; g.chandPos = [];
  for(let i=0;i<g.bays;i++){ const z=(i+0.5)*g.bayL; for(const sx of [-1,1]){ g.pendPos.push([sx*W*0.22,z]); if(i%2===0) g.chandPos.push([sx*W*0.2,z]); } }
  g.trackPos = []; for(let z=7; z<=D-6; z+=8.5) for(const sx of [-1,1]) g.trackPos.push([sx*W*0.16, z]);
  g.fanZ = [D*0.25, D*0.5, D*0.75];
  g.nProj = s.screens==='both'||s.screens==='motor' ? 2 : s.screens==='single' ? 1 : 0;
  // narthex / seating zone
  g.narthexOn = s.narthex!=='none'; g.nD = 0;   // a narthex screen sits on the existing beam line, so it takes no nave depth
  g.zNarthex = D-g.nD;
  const anti = s.arrange==='antiphonal';
  g.aisle = Math.min(W-10, anti ? Math.max(lay(s,'aisleW'), 10) : lay(s,'aisleW'));
  const spacing = lay(s,'rowSpacing'), cw = d.chairW;
  const sideClear = Math.max(s.sideAisles==='yes'?4:0.5, s.pilasters==='columns'?6.5:0, s.pilasters==='pilasters'?1:0);
  g.sideClear = sideClear;
  g.zFront = g.zStep + d.frontClear + (s.rail!=='none'?1.5:0) + (s.choir==='chancel'?0:0);
  g.zRear = D - Math.max(d.rearClear, g.narthexOn ? g.nD+4 : 0, s.choir==='rear' ? 14 : 0);
  const avail = Math.max(0, g.zRear-g.zFront);
  g.rowsList = []; g.maxRows = avail<1.6 ? 0 : Math.floor((avail-1.6)/spacing)+1;
  if(!anti){
    const maxPer = Math.max(0, Math.floor(((W-g.aisle)/2 - sideClear)/cw)), per = Math.min(lay(s,'perRow'), maxPer);
    const maxRows = avail<1.6 ? 0 : Math.floor((avail-1.6)/spacing)+1, rows = Math.min(lay(s,'rows'), maxRows);
    if(per < lay(s,'perRow')) g.warn.push(`Only ${per} seats per row fit beside a ${g.aisle} ft aisle (asked for ${lay(s,'perRow')}).`);
    if(rows < lay(s,'rows')) g.warn.push(`Only ${rows} rows fit at ${spacing} ft spacing (asked for ${lay(s,'rows')}).`);
    for(let i=0;i<rows;i++) for(const sx of [-1,1]) if(per>0) g.rowsList.push({x:sx*(g.aisle/2+per*cw/2), z:g.zFront+0.8+i*spacing, ry:0, len:per*cw, n:per});
  } else {
    const rows = Math.max(0, Math.min(4, lay(s,'rows'), Math.floor(((W-g.aisle)/2 - sideClear - 1.6)/spacing)+1)), nn = Math.floor(avail/cw);
    for(let r=0;r<rows;r++) for(const sx of [-1,1]) if(nn>0) g.rowsList.push({x:sx*(g.aisle/2+0.8+r*spacing), z:g.zFront+avail/2, ry:sx<0?-Math.PI/2:Math.PI/2, len:nn*cw, n:nn});
  }
  g.seats = g.rowsList.reduce((a,r) => a+r.n, 0);
  g.pewLF = g.rowsList.reduce((a,r) => a+r.len, 0);
  g.lastRowZ = anti ? g.zRear : (g.rowsList.length ? Math.max(...g.rowsList.map(r=>r.z)) : g.zFront);
  g.layoutChanged = anti || s.sideAisles==='yes' || LAYOUT_KEYS.some(k => s[k]!=null && s[k]!==DIM[k]);
  // font
  g.fontZ = s.fontPos==='entrance' ? D - Math.max(5, g.narthexOn ? g.nD*0.5 : 5) : Math.min(D-4, g.lastRowZ + 4.2);
  // areas
  g.aAddNave = W*ext; g.aAddChancel = W*g.cA; g.aAddAisle = g.aw*D;
  g.aChancel = apse ? g.cw*g.cA + (g.pw+2*g.stepsD)*g.stepsD : (g.pw+2*g.stepsD)*(g.pd+g.stepsD);
  g.aEntry = 2*g.ea*g.eD + (g.narthexOn ? W*g.nD : 0);     // the alcove, plus the narthex zone when one is defined
  const entryCut = s.entryFloor!=='asis' && g.narthexOn;
  g.aAisle = g.aisle*(D - g.zStep - (entryCut?g.nD:0));
  g.aSeat = W*D + g.cw*g.cA + g.aAddAisle - g.aChancel - g.aAisle - (entryCut ? W*g.nD : 0);
  const openA = L => L.reduce((a,o) => a+o.w*o.h, 0);
  g.wallSide = 2*D*wallH - openA(g.openL) - openA(g.openR);
  const gable = W*wallH + W*rise/2;
  g.roseR = Math.min(3.5, rise*0.36); g.roseSF = Math.PI*g.roseR*g.roseR;
  g.wallRear = gable - 42;
  g.wallChancel = gable - g.glassSF - 2*3.3*6.8;
  g.ceilSF = 2*g.slopeL*D + (g.cw/W)*2*g.slopeL*g.cA + g.aAddAisle; g.perim = 2*(W+D);
  const cladAll = s.clad.endsWith('All'), cladCh = s.clad!=='none';
  g.paintSF = cladAll ? 0 : g.wallSide + g.wallRear + (s.chancelPaint==='same' && !cladCh ? g.wallChancel : 0);
  g.chPaintSF = cladCh ? 0 : g.wallChancel;
  g.wainsLF = 2*D + W - 6 + Math.max(0, 2*g.eD + 2*g.ea - 15) - g.openL.concat(g.openR).filter(o=>o.y===0).reduce((a,o)=>a+o.w,0);
  g.railLF = Math.max(0, g.pw - 4);
  g.heavensSF = apse ? (g.cw/W)*2*g.slopeL*g.cA : 2*g.slopeL*g.bayL;
  g.muralSF = gw*(g.sill-0.6-g.ph);
  g.choirLF = 2*10;
  g.volume = W*D*(wallH+rise/2) + g.cw*g.cA*(g.ceilY(g.cw/2)+ridgeH)/2 + g.aAddAisle*g.hR;
  return g;
}

/* ---- acoustics: rough Sabine estimate (imperial: RT60 = 0.049 V / A) ---- */
function acoustics(s, g){
  const fl = (v,def) => (FLOORS[v]||FLOORS[def]).ab;
  let A = g.aSeat*fl(s.floorSeat,'seatAsis') + g.aAisle*fl(aisleType(s),'seatAsis') + g.aChancel*fl(s.floorChancel,'chancelAsis');
  if(s.entryFloor!=='asis') A += g.aEntry*FLOORS[s.entryFloor].ab;
  const wallAb = s.clad.startsWith('stone') ? .03 : s.clad.startsWith('lime') ? .04 : .06;
  const all = s.clad.endsWith('All');
  A += (g.wallSide+g.wallRear)*(all?wallAb:.06) + g.wallChancel*(s.clad!=='none'?wallAb:.06);
  if(s.wainscot!=='none') A += g.wainsLF*(+s.wainscot)*0.04;
  A += g.ceilSF*({asis:.28, smooth:.07, tg:.10, coffer:.13})[s.ceilFinish];
  A += g.glassSF*0.05 + 90;                                    // glass + misc furnishings, air
  const per = ({asis:2.2, burgundy:2.2, tan:2.2, chapel:.3, pews:.35, pewsK:.4, used:.35})[s.seating];
  const empty = A + g.seats*per, occ = A + g.seats*(0.4*per + 0.6*4.4);
  const rtE = 0.049*g.volume/empty, rtO = 0.049*g.volume/occ;
  const label = rtO<0.95 ? 'Drier' : rtO<1.5 ? 'Balanced' : rtO<2.3 ? 'Live' : 'Very live';
  const color = rtO<0.95 ? '#9db4c8' : rtO<1.5 ? '#9fcf98' : rtO<2.3 ? '#e7c979' : '#e59a6a';
  const note = rtO<0.95 ? 'Speech is clear; singing and chant get little support from the room.' : rtO<1.5 ? 'Good for speech with some bloom for hymns.' :
    rtO<2.3 ? 'Supports chant, organ and hymn singing; plan the sound system for speech clarity.' : 'Cathedral-like; speech needs a well-designed column-array system.';
  return {rtE, rtO, label, color, note};
}

/* ---- cost roll-up ---- */
let _baseSeats = null;
function computeCost(s, set = SET){
  const g = geo(s);
  if(_baseSeats==null) _baseSeats = geo(ASIS).seats;
  g.baseSeats = _baseSeats;
  const lines = [], bycat = {};
  for(const cat of CATS) for(const grp of cat.groups){
    if(grp.ref) continue;
    for(const [k,q,note] of (grp.cost(s[grp.id], g, s) || [])){
      if(!(q>0)) continue; const c = COST[k];
      const ln = {cat:cat.name, catId:cat.id, gid:grp.id, grp:grp.label, key:k, item:c.label, qty:q, unit:c.unit, lo:c.lo, hi:c.hi, tlo:q*c.lo, thi:q*c.hi, note:note||''};
      lines.push(ln); const b = bycat[cat.id] ||= {lo:0,hi:0}; b.lo += ln.tlo; b.hi += ln.thi;
    }
  }
  const sub = lines.reduce((a,l) => (a.lo+=l.tlo, a.hi+=l.thi, a), {lo:0,hi:0});
  const cont = {lo:sub.lo*set.cont/100, hi:sub.hi*set.cont/100}, des = {lo:sub.lo*set.design/100, hi:sub.hi*set.design/100};
  const total = {lo:sub.lo+cont.lo+des.lo, hi:sub.hi+cont.hi+des.hi};
  return {g, lines, bycat, sub, cont, des, total, seats:g.seats, baseSeats:g.baseSeats, ac:acoustics(s,g)};
}

/* ======================================================================
   5. PROCEDURAL TEXTURES (canvas-drawn; no image assets)

function rng(seed){ let a = seed|0; return () => { a = a+0x6D2B79F5|0; let t = Math.imul(a^a>>>15, 1|a); t = t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

}
const PH_RULES = [
  [['expNave','expChancel','expAisle'], ['wallPaint','platform','rail','altarBack','floorChancel','ceilFinish','trusses','wainscot','clad','floorSeat','floorAisle','seating','glass'], 'Expansion should come before the finishes it would disturb.'],
  [['ceilFinish','trusses'], ['fixtures','tracks','fans','accent','heavens'], 'Ceiling-mounted items should wait for the new ceiling, or they are installed twice.'],
  [['ceilFinish','trusses','wainscot','clad','pilasters'], ['floorSeat','floorAisle','seating'], 'Overhead and wall work should finish before new floors and seating go in.'],
  [['floorSeat'], ['seating'], 'New seating should follow the new floor (pews are anchored to it).'],
  [['platform'], ['rail','altarPos','altarBack','floorChancel','pulpit'], 'The platform should be rebuilt before the things that stand on it.'],
];
function makePlan(s, set = SET){
  const C = computeCost(s, set), items = [], k = 1+(set.cont+set.design)/100, idx = id => PHASES.findIndex(p => p.id===id);
  for(const id in GROUPS){ if(s[id]===ASIS[id]) continue; const [sg, note] = suggestPhase(id, s), ov = phaseOv[id] && phaseOv[id]!==sg ? phaseOv[id] : null, ls = C.lines.filter(l => l.gid===id);
    items.push({id, ph:ov || sg, sg, moved:!!ov, note:ov ? 'Moved by you (suggested: '+PHASES[idx(sg)].name+').' : note, lo:ls.reduce((a,l) => a+l.tlo,0), hi:ls.reduce((a,l) => a+l.thi,0)}); }
  const st = {...ASIS}, phases = []; let cumLo = 0, cumHi = 0;
  for(const P of orderedPhases()){ const its = items.filter(i => i.ph===P.id); if(!its.length) continue;
    for(const i of its) st[i.id] = s[i.id];
    const lo = its.reduce((a,i) => a+i.lo,0)*k, hi = its.reduce((a,i) => a+i.hi,0)*k; cumLo += lo; cumHi += hi;
    const state = {...st}, g = geo(state);
    phases.push({...P, items:its, lo, hi, cumLo, cumHi, state, seats:g.seats, ac:acoustics(state, g), pct:C.total.hi ? Math.round(cumHi/C.total.hi*100) : 100}); }
  const pos = id => { const it = items.find(i => i.id===id); return it ? phases.findIndex(p => p.id===it.ph) : -1; }, warn = [];
  for(const [a,b,msg] of PH_RULES){ const pa = a.map(pos).filter(x => x>=0), pb = b.map(pos).filter(x => x>=0); if(pa.length && pb.length && Math.max(...pa) > Math.min(...pb)) warn.push(msg); }
  return {phases, C, warn, set};
}
function phasesHTML(plan, print){
  if(!plan.phases.length) return '<div class="note">Nothing to phase yet — the design is still the existing sanctuary. Choose some options first.</div>';
  const cur = view.before ? 'asis' : view.phase==null ? 'final' : view.phase, btn = (v,l) => `<button data-pv="${v}" class="${cur===v?'on':''}">${l}</button>`;
  const col = phCollapsed && !print, seq = ['asis', ...plan.phases.map((p,i) => i), 'final'], ci = seq.indexOf(cur);
  let h = print ? '' : `<h3 style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>Phased plan — ${esc(loadedName || 'current selections')}</span><button id="phToggle" style="font:13px var(--sans)">${col ? 'Show details ▴' : 'Collapse to buttons ▾'}</button></h3>`;
  if(!col) h += `<div class="note">${plan.phases.length} phases, ${orderChanged() ? 'in your custom order (the suggested order puts the most visible change per dollar first and avoids installing anything twice).' : 'ordered so the most visible change per dollar comes first and nothing is installed twice.'} Each phase total includes ${plan.set.cont}% contingency and ${plan.set.design}% design/permits, and the phases add up to the full estimate (${rng2(plan.C.total.lo, plan.C.total.hi)}).${print ? '' : ' Use the buttons to walk the room as it would look after each phase; use the menus to move an item to a different phase.'}</div>`;
  if(!print) h += `<div class="phsteps"><span class="note">Click to preview in 3D, drag a phase to reorder:</span><button data-pv="${seq[Math.max(0,ci-1)]}" title="Previous" ${ci<=0?'disabled':''}>◀</button>${btn('asis','As-is')}${plan.phases.map((p,i) => `<button draggable="true" data-phid="${p.id}" data-pv="${i}" class="${cur===i?'on':''}" title="After phase ${i+1}: ${esc(p.name)} — drag to reorder">${i+1} · ${esc(p.short)}</button>`).join('')}${btn('final','Final design')}<button data-pv="${seq[Math.min(seq.length-1,ci+1)]}" title="Next" ${ci>=seq.length-1?'disabled':''}>▶</button></div>`;
  if(col){ const p = typeof cur==='number' ? plan.phases[cur] : null;
    return h + `<div class="note" style="font-size:13px">${p ? `<b style="color:var(--gilt2)">Phase ${cur+1} · ${esc(p.name)}</b> — this phase ${rng2(p.lo,p.hi)} · running total ${rng2(p.cumLo,p.cumHi)} (${p.pct}%) · ${p.seats} seats · ${p.items.length} items` : cur==='asis' ? 'The existing sanctuary, before any work.' : `<b style="color:var(--gilt2)">Final design</b> — all ${plan.phases.length} phases complete · ${rng2(plan.C.total.lo, plan.C.total.hi)}`}${plan.warn.length ? ` <span style="color:var(--warn)">⚠ ${plan.warn.length} sequencing warning${plan.warn.length>1?'s':''} — show details</span>` : ''}</div>`; }
  h += plan.warn.map(w => `<div class="warnbox">⚠ ${esc(w)}</div>`).join('');
  plan.phases.forEach((p,i) => { h += `<div class="phase ${cur===i?'cur':''}"><div class="ph-h"><b>${print ? '' : `<button data-mv="${p.id}:-1" title="Move this phase earlier" ${i===0?'disabled':''} style="padding:1px 7px">▲</button> <button data-mv="${p.id}:1" title="Move this phase later" ${i===plan.phases.length-1?'disabled':''} style="padding:1px 7px">▼</button> `}Phase ${i+1} · ${esc(p.name)}</b><span class="num">${rng2(p.lo,p.hi)} · running total ${rng2(p.cumLo,p.cumHi)} (${p.pct}%)</span></div>
      <div class="note">${esc(p.why)}</div><div class="note"><b>Milestone:</b> ${p.seats} seats · acoustics ${p.ac.label.toLowerCase()} (~${p.ac.rtO.toFixed(1)} s) · ${p.pct}% of the budget committed.</div><table>` +
      p.items.map(it => `<tr><td>${esc(GROUPS[it.id].label)}: <b>${esc(optLabel(it.id, plan.phases[plan.phases.length-1].state[it.id]))}</b>${it.note ? `<br><small style="opacity:.7">${esc(it.note)}</small>` : ''}</td><td class="r num">${it.hi ? rng2(it.lo,it.hi) : '$0'}</td>${print ? '' :
        `<td class="r"><select data-ph="${it.id}">${orderedPhases().map((P,j) => `<option value="${P.id}" ${P.id===it.ph?'selected':''}>${esc(P.name)}${P.id===it.sg?' (suggested)':''}</option>`).join('')}</select></td>`}</tr>`).join('') + `</table></div>`; });
  if(!print) h += `<button id="phReset" ${Object.keys(phaseOv).length || orderChanged() ? '' : 'disabled'}>Reset to the suggested phases and order</button><div class="disc">Phase costs are rough 2026 Central Ohio ballparks, not quotes. Item costs shown are before contingency and design; phase totals include them. Sequencing is a starting point for your architect and contractor, who may regroup work to suit bids, seasons and the church calendar.</div>`;
  return h;
}

/* ---------------- printable summary ---------------- */
function printSummary(){
  const st = view.before ? ASIS : S, C = computeCost(st); renderer.render(scene, camera); let img = ''; try{ img = canvas.toDataURL('image/jpeg', 0.85); }catch(e){}
  let sel = ''; for(const c of CATS){ const rows = c.groups.filter(g => !g.ref && st[g.id]!==ASIS[g.id]).map(g => `<tr><td>${esc(g.label)}</td><td>${esc(optLabel(g.id, st[g.id]))}</td></tr>`).join(''); if(rows) sel += `<tr class="cat"><td colspan="2">${esc(c.name)}</td></tr>`+rows; }
  const flags = Object.values(GROUPS).map(g => g.flag && g.flag(st[g.id], C.g)).filter(Boolean);
  $('printArea').innerHTML = `<h1>Hope Lutheran Church, Sunbury, Ohio — Sanctuary redesign summary</h1><div>${esc(view.before ? 'Existing sanctuary (as-is)' : (loadedName || 'Current selections'))} · printed ${new Date().toLocaleDateString()}</div>
    ${img ? `<img src="${img}" alt="View of the selected design">` : ''}
    <h2>Selections (changes from the existing sanctuary)</h2><table>${sel || '<tr><td>None — existing sanctuary.</td></tr>'}</table>
    ${flags.length ? `<h2>Items needing professional review</h2><ul>${flags.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
    ${view.before ? '' : `<h2>Phased plan</h2>${phasesHTML(makePlan(S), true)}`}
    <h2>Itemized estimate</h2>${costTable(C, view.before ? 'As-is' : (loadedName || 'Current selections'))}
    <h2>Room dimensions used</h2><table>${DIM_META.map(m => `<tr><td>${esc(m[1])}</td><td class="r">${DIM[m[0]]}</td></tr>`).join('')}</table>`;
  setTimeout(() => window.print(), 50);
}

/* ---------------- dimensions & prices tabs ---------------- */
function renderDims(){
  const el = $('tab-dims'); if(!el.classList.contains('on')) return; const g = geo(view.before ? ASIS : S), ae = document.activeElement;
  if(ae && ae.dataset && ae.dataset.dim){ $('dimQ').innerHTML = dimQ(g); return; }
  el.innerHTML = `<div class="note">All values in feet. These start as estimates from photos — replace them with tape-measured numbers and the model, seat count and every quantity update.</div>` +
    DIM_META.map(m => `<div class="dimrow"><span>${esc(m[1])}</span><input type="number" data-dim="${m[0]}" value="${DIM[m[0]]}" min="${m[3]}" max="${m[4]}" step="${m[5]}"></div>`).join('') +
    `<div style="margin:8px 0"><button id="dimReset">Reset to photo estimates</button></div><h3>Computed quantities</h3><div id="dimQ">${dimQ(g)}</div>`;
  $('dimReset').onclick = () => { DIM_META.forEach(m => DIM[m[0]] = m[2]); _baseSeats = null; update(); el.querySelectorAll('[data-dim]').forEach(i => i.value = DIM[i.dataset.dim]); };
}
function dimQ(g){ const r = (a,b) => `<div class="dimrow"><span>${a}</span><b class="num">${b}</b></div>`;
  return r('Seating-area floor', fq(g.aSeat)+' sf') + r('Center-aisle floor', fq(g.aAisle)+' sf') + r('Chancel platform + steps', fq(g.aChancel)+' sf') + r('Side walls (less openings)', fq(g.wallSide)+' sf') + r('Rear wall', fq(g.wallRear)+' sf') + r('Chancel wall (less glass, doors)', fq(g.wallChancel)+' sf') +
    r('Ceiling, along the slope', fq(g.ceilSF)+' sf') + r('Chancel stained glass', fq(g.glassSF)+' sf') + r('Side-wall glass', fq(g.sideGlassSF)+' sf') + r('Wall perimeter', fq(g.perim)+' lf') + r('Communion rail length', fq(g.railLF)+' lf') + r('Seating length (pews)', fq(g.pewLF)+' lf') +
    r('Seats', g.seats) + r('Bays / trusses', g.bays+' / '+g.nTruss) + r('Room volume', fq(g.volume)+' cu ft'); }
$('tab-dims').addEventListener('change', e => { const k = e.target.dataset.dim; if(!k) return; const m = DIM_META.find(m => m[0]===k); let v = parseFloat(e.target.value); if(!isFinite(v)) v = m[2]; v = Math.min(m[4], Math.max(m[3], v)); DIM[k] = v; e.target.value = v; _baseSeats = null; update(); });
function renderPrices(){
  $('tab-prices').innerHTML = `<div class="note">Installed unit costs, low and high. Correct these as real quotes come in; totals update at once. (The same table is the <code>COST</code> object near the top of this file.)</div><div style="margin:6px 0"><button id="costReset">Reset all prices</button></div><table><tr><th>Item</th><th>Unit</th><th>Low $</th><th>High $</th></tr>` +
    Object.entries(COST).map(([k,c]) => `<tr><td>${esc(c.label)}</td><td>${c.unit}</td><td><input type="number" data-cost="${k}" data-f="lo" value="${c.lo}" min="0" step="any"></td><td><input type="number" data-cost="${k}" data-f="hi" value="${c.hi}" min="0" step="any"></td></tr>`).join('') + '</table>';
  $('costReset').onclick = () => { for(const k in COST){ COST[k].lo = COST_DEF[k].lo; COST[k].hi = COST_DEF[k].hi; } renderPrices(); save(); refreshUI(); };

$('tab-prices').addEventListener('change', e => { const k = e.target.dataset.cost; if(!k) return; const v = Math.max(0, parseFloat(e.target.value)||0); COST[k][e.target.dataset.f] = v; save(); refreshUI(); });

/* ---------------- wiring ---------------- */
function update(){ view.phase = null; save(); build(); refreshUI(); }
function setBefore(on, quiet){ view.before = on; $('ba').classList.toggle('on', on); $('ba').textContent = on ? 'Showing as-is — back to redesign' : 'Show as-is (before)'; if(on) view.phase = null; if(!quiet){ build(); refreshUI(); } }
function toggleBefore(){ if(!view.before && sameState(S, ASIS)) return; setBefore(!view.before); }
$('ba').onclick = toggleBefore;
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x===b)); document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id==='tab-'+b.dataset.tab)); refreshUI(); });
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('#presets button').forEach(b => b.onclick = () => preset(b.dataset.p));
$('ptoggle').onclick = () => { $('panel').classList.toggle('closed'); sizeCanvas(); };
if(innerWidth <= 900) $('panel').classList.add('closed');   // small screens start with the room, not the panel
function openDrawer(mode){ const d = $('drawer'), same = d.classList.contains('on') && drawerMode===mode; drawerMode = mode; d.classList.toggle('on', !same);
  if(same && view.phase!=null){ view.phase = null; build(); }
  $('b-items').textContent = !same && mode==='items' ? 'Itemized ▾' : 'Itemized ▴'; $('b-phases').classList.toggle('on', !same && mode==='phases'); refreshUI(); d.scrollTop = 0; }
$('b-items').onclick = () => openDrawer('items');
$('b-phases').onclick = () => openDrawer('phases');
$('drawer').addEventListener('click', e => { const b = e.target.closest('[data-pv]'); if(b){ const v = b.dataset.pv;
    if(v==='asis') setBefore(true); else { view.before = false; $('ba').classList.remove('on'); $('ba').textContent = 'Show as-is (before)'; view.phase = v==='final' ? null : +v; build(); refreshUI(); } return; }
  if(e.target.id==='phToggle'){ phCollapsed = !phCollapsed; refreshUI(); return; }
  const mv = e.target.closest('[data-mv]');
  if(mv && PLAN){ const [id, d] = mv.dataset.mv.split(':'), vis = PLAN.phases.map(p => p.id), other = vis[vis.indexOf(id)+(+d)];
    if(other){ const a = phaseOrder.indexOf(id), b = phaseOrder.indexOf(other); phaseOrder[a] = other; phaseOrder[b] = id; view.phase = null; save(); build(); refreshUI(); } return; }
  if(e.target.id==='phReset'){ phaseOv = {}; phaseOrder = [...PH_DEFAULT]; view.phase = null; save(); build(); refreshUI(); } });
/* drag a phase button in the strip to reorder the phases */
let dragPh = null;
const clearDrop = () => document.querySelectorAll('.dropL,.dropR,.dragging').forEach(b => b.classList.remove('dropL','dropR','dragging'));
$('drawer').addEventListener('dragstart', e => { const b = e.target.closest && e.target.closest('[data-phid]'); if(!b) return; dragPh = b.dataset.phid; b.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', dragPh); }catch(err){} });
$('drawer').addEventListener('dragover', e => { const b = e.target.closest && e.target.closest('[data-phid]'); if(!b || !dragPh || b.dataset.phid===dragPh) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const r = b.getBoundingClientRect(), after = e.clientX > r.left+r.width/2; b.classList.toggle('dropR', after); b.classList.toggle('dropL', !after); });
$('drawer').addEventListener('dragleave', e => { const b = e.target.closest && e.target.closest('[data-phid]'); if(b) b.classList.remove('dropL','dropR'); });
$('drawer').addEventListener('drop', e => { const b = e.target.closest && e.target.closest('[data-phid]'); if(!b || !dragPh) return; e.preventDefault();
  const r = b.getBoundingClientRect(), after = e.clientX > r.left+r.width/2, id = dragPh, tgt = b.dataset.phid; dragPh = null; clearDrop();
  if(id!==tgt){ phaseOrder = phaseOrder.filter(x => x!==id); phaseOrder.splice(phaseOrder.indexOf(tgt)+(after?1:0), 0, id); view.phase = null; save(); build(); refreshUI(); } });
$('drawer').addEventListener('dragend', () => { dragPh = null; clearDrop(); });
function movePhase(id, tgt, after){ if(id===tgt) return; phaseOrder = phaseOrder.filter(x => x!==id); phaseOrder.splice(phaseOrder.indexOf(tgt)+(after?1:0), 0, id); view.phase = null; save(); build(); refreshUI(); }
/* touch has no HTML5 drag, so do the same reorder with pointer events */
const tdrag = {id:null, ph:null, x:0, y:0, on:false, tgt:null, after:false}; let tdragJust = false;
$('drawer').addEventListener('pointerdown', e => { const b = e.pointerType==='touch' && e.target.closest('[data-phid]'); if(!b) return; Object.assign(tdrag, {id:e.pointerId, ph:b.dataset.phid, x:e.clientX, y:e.clientY, on:false, tgt:null}); });
addEventListener('pointermove', e => { if(e.pointerId!==tdrag.id) return;
  if(!tdrag.on){ if(Math.hypot(e.clientX-tdrag.x, e.clientY-tdrag.y) < 10) return; tdrag.on = true; const me = document.querySelector(`[data-phid="${tdrag.ph}"]`); if(me) me.classList.add('dragging'); }
  document.querySelectorAll('.dropL,.dropR').forEach(b => b.classList.remove('dropL','dropR')); tdrag.tgt = null;
  const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest('[data-phid]'); if(!b || b.dataset.phid===tdrag.ph) return;
  const r = b.getBoundingClientRect(); tdrag.after = e.clientX > r.left+r.width/2; tdrag.tgt = b.dataset.phid; b.classList.add(tdrag.after ? 'dropR' : 'dropL'); });
const tdragEnd = e => { if(e.pointerId!==tdrag.id) return; const {on, ph, tgt, after} = tdrag; tdrag.id = null; clearDrop();
  if(on){ tdragJust = true; setTimeout(() => tdragJust = false, 350); if(tgt && e.type==='pointerup') movePhase(ph, tgt, after); } };
addEventListener('pointerup', tdragEnd); addEventListener('pointercancel', tdragEnd);
$('drawer').addEventListener('click', e => { if(tdragJust){ e.stopPropagation(); e.preventDefault(); } }, true);
$('drawer').addEventListener('change', e => { const id = e.target.dataset.ph; if(!id) return; if(e.target.value===suggestPhase(id, S)[0]) delete phaseOv[id]; else phaseOv[id] = e.target.value; view.phase = null; save(); build(); refreshUI(); });
$('b-print').onclick = printSummary;
$('i-cont').onchange = e => { SET.cont = Math.max(0, Math.min(50, parseFloat(e.target.value)||0)); save(); refreshUI(); };
$('i-design').onchange = e => { SET.design = Math.max(0, Math.min(30, parseFloat(e.target.value)||0)); save(); refreshUI(); };
addEventListener('resize', sizeCanvas);

load(); renderOptions(); renderPrices(); sizeCanvas(); build(); setMode('walk'); preset('rear'); refreshUI(); requestAnimationFrame(frame);
window.__app = {makePlan, get PLAN(){ return PLAN; }, get S(){ return S; }, set(id,v){ S[id] = v; update(); }, reset(){ S = asisState(); update(); }, ASIS, GROUPS, CATS, DIM, COST, computeCost, geo, update, view, setMode, preset, setBefore, renderer, scene, camera, walk};
</script>
